services:
  # Backend API
  - type: web
    name: portal-crm-api
    env: node
    buildCommand: cd backend && npm install
    startCommand: cd backend && npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 3000
      # Estas variables las configurarás en el dashboard de Render
      - key: JWT_SECRET
        sync: false
      - key: DB_HOST
        sync: false
      - key: DB_USER
        sync: false
      - key: DB_PASSWORD
        sync: false
      - key: DB_NAME
        sync: false
      - key: DB_PORT
        sync: false
  
  # Frontend Angular
  - type: web
    name: portal-crm-frontend
    env: static
    buildCommand: cd frontend && npm install && npm run build:render
    staticPublishPath: ./frontend/dist/frontend/browser
    headers:
      - path: /*
        name: Cache-Control
        value: public, max-age=3600
    routes:
      - type: rewrite
        source: /*
        destination: /index.html